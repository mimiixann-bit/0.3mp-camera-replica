[versions]
kotlin = "2.0.21"
agp = "8.7.0"
camerax = "1.4.0"
compose-bom = "2024.10.00"
room = "2.6.1"
lifecycle = "2.8.6"
billing = "7.1.1"
coroutines = "1.9.0"
ksp = "2.0.21-1.0.28"

[libraries]
camerax-core        = { module = "androidx.camera:camera-core",                     version.ref = "camerax" }
camerax-camera2     = { module = "androidx.camera:camera-camera2",                  version.ref = "camerax" }
camerax-lifecycle   = { module = "androidx.camera:camera-lifecycle",                version.ref = "camerax" }
camerax-view        = { module = "androidx.camera:camera-view",                     version.ref = "camerax" }
camerax-video       = { module = "androidx.camera:camera-video",                    version.ref = "camerax" }
compose-bom         = { module = "androidx.compose:compose-bom",                    version.ref = "compose-bom" }
compose-ui          = { module = "androidx.compose.ui:ui" }
compose-foundation  = { module = "androidx.compose.foundation:foundation" }
compose-material3   = { module = "androidx.compose.material3:material3" }
compose-preview     = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling     = { module = "androidx.compose.ui:ui-tooling" }
room-runtime        = { module = "androidx.room:room-runtime",                      version.ref = "room" }
room-ktx            = { module = "androidx.room:room-ktx",                          version.ref = "room" }
room-compiler       = { module = "androidx.room:room-compiler",                     version.ref = "room" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
billing             = { module = "com.android.billingclient:billing-ktx",           version.ref = "billing" }
coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",version.ref = "coroutines" }
coil                = { module = "io.coil-kt:coil-compose",                         version = "2.7.0" }
navigation          = { module = "androidx.navigation:navigation-compose",          version = "2.8.3" }
permissions         = { module = "com.google.accompanist:accompanist-permissions",  version = "0.36.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",        version.ref = "ksp" }
