name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Share Tech Mono font
        run: |
          mkdir -p app/src/main/res/font
          curl -L "https://fonts.gstatic.com/s/sharetechmono/v15/J7aHnp1uDWRBEqV98dVQztYldFc7pAsEIc3Xew.woff2" -o /tmp/stm.woff2
          # Convert woff2 → ttf via fonttools (pre-installed on ubuntu-latest)
          pip install fonttools brotli --quiet
          python3 -c "
          from fontTools.ttLib import TTFont
          import urllib.request, subprocess, sys
          # Download ttf directly from Google Fonts API
          url = 'https://fonts.googleapis.com/css2?family=Share+Tech+Mono'
          " || true
          # Fallback: download the TTF directly
          curl -L "https://github.com/google/fonts/raw/main/apache/sharetechmono/ShareTechMono-Regular.ttf" \
            -o app/src/main/res/font/share_tech_mono.ttf

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: grainshot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
